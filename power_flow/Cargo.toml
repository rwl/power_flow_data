[package]
name = "power_flow"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
num-complex = "0.4"
sundials = "0.2"
#sundials = { path = "../../sundials" }
sparsetools = "0.2.4"
#sparsetools = { path = "../../sparsetools" }
arrayvec = "0.7"

[dependencies.power_flow_data]
version = "0.4"
#path = "../power_flow_data"

[dev-dependencies]
float-cmp = "0.9"
caseformat = { version = "0.2", features = ["raw", "testcase"] }
#caseformat = { path = "../../caseformat", features = ["raw", "testcase"] }